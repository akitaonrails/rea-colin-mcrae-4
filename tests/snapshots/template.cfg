# Colin McRae Rally 04 launcher settings.
# One setting per line as key = value; # starts a comment. An unset value
# uses the default. Command-line options override these values for one run;
# only --game is remembered here. An unset resolution is filled in with the
# one the launcher picks from the screen.

# The folder of your installed game, with cmr4.exe, or of its supported
# installer, which is unpacked once and never run. It is only read, never
# changed.
# Values: a folder or file.
#game =

# Sets the picture in one go: Original as the game shipped, Widescreen
# fitted to your screen, or Steam Deck (1280x800 at 60 fps).
# Values: original, widescreen or steam_deck.
#look =

# The picture size. A 16:9 size shows the full widescreen view; other shapes
# keep the game's own view. Original keeps the game's own mode.
# Values: WIDTHxHEIGHT or original.
#resolution = 1920x1080

# The most frames per second the game draws; 0 or off for no cap.
# Values: 0 to 1000.
#fps_limit = 60

# Waits for the screen before showing each frame: no tearing, slightly more
# input delay.
# Values: on or off.
#vsync =

# Lets the game use an Xbox-style pad: the left stick steers and the
# triggers are analogue pedals. Off: the game reads the pad on its own
# (under Wine only its buttons work).
# Values: on or off.
#controller =

# Show the game one wheel made from your wheel and pedals: auto when a wheel
# is plugged in as the game starts.
# Values: auto, on or off.
#wheel =

# The wheel to drive with, by its DirectInput instance GUID; empty picks
# one.
# Values: text.
#wheel_device =

# Separate pedals, by their DirectInput instance GUID; empty uses the
# calibrated pedals or the wheel's own.
# Values: text.
#wheel_pedals =

# How far you turn the wheel for full lock in the game. Full is the wheel's
# whole rotation.
# Values: 180, 270, 360, 540, 900 or full.
#wheel_lock =

# A small band in the centre that does nothing (percent), for a wheel that
# drifts.
# Values: 0 to 25.
#wheel_deadzone =

# 0 steers as much as you turn; up to 100 softens small turns near the
# centre.
# Values: 0 to 100.
#wheel_curve =

# For a throttle that reads backwards.
# Values: on or off.
#wheel_invert_throttle =

# For a brake that reads backwards.
# Values: on or off.
#wheel_invert_brake =

# How hard the wheel pushes back in the game (percent; 0 is off). Go lower
# on a direct-drive wheel.
# Values: 0 to 100.
#wheel_ffb =

# Only for a wheel that pulls the wrong way.
# Values: on or off.
#wheel_ffb_invert =

# Write rea_wheel.log next to the game, for bug reports.
# Values: on or off.
#wheel_log =

# Where the launcher keeps its own copy of the game, with your saves and
# settings. Empty: %LOCALAPPDATA%\CMR4Launcher\CMR4. It must be outside the
# game folder.
# Values: a folder or file.
#runtime =
