# Colin McRae Rally 04 launcher settings.
# One setting per line as key = value; # starts a comment. An unset value
# uses the default. Command-line options override these values for one run;
# only --game is remembered here. An unset resolution is filled in with the
# one the launcher picks from the screen.

# The folder of your installed game, with cmr4.exe. It is only read, never
# changed.
# Values: a folder or file.
#game =

# Sets the picture in one go: Original as the game shipped, Widescreen
# fitted to your screen, or Steam Deck (1280x800 at 60 fps).
# Values: original, widescreen or steam_deck.
#look =

# The picture size. A 16:9 size shows the full widescreen view; other shapes
# keep the game's own view. Original keeps the game's own mode.
# Values: WIDTHxHEIGHT or original.
#resolution = 1920x1080

# The most frames per second the game draws; 0 or off for no cap.
# Values: 0 to 1000.
#fps_limit = 60

# Waits for the screen before showing each frame: no tearing, slightly more
# input delay.
# Values: on or off.
#vsync =

# Lets the game use an Xbox-style pad: the left stick steers and the
# triggers are analogue pedals. Off: the game reads the pad on its own
# (under Wine only its buttons work).
# Values: on or off.
#controller =

# Where the launcher keeps its own copy of the game, with your saves and
# settings. Empty: %LOCALAPPDATA%\CMR4Launcher\CMR4. It must be outside the
# game folder.
# Values: a folder or file.
#runtime =
