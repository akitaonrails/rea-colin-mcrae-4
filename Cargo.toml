[package]
name = "cmr4-launcher"
version = "0.5.2"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
description = "Runs the user's own copy of Colin McRae Rally 04 on modern Windows and under Proton/Wine"

[workspace]

[[bin]]
name = "CMR4Launcher"
path = "src/main.rs"

[dependencies]
rea-launcher = { git = "https://github.com/akitaonrails/rea-launcher-sdk", tag = "v0.8.2" }
# The settings window's drawing is portable (src/window.rs), so its GUI
# tests run headless on the host as well as under Wine.
rea-launcher-ui = { git = "https://github.com/akitaonrails/rea-launcher-sdk", tag = "v0.8.2" }
# The close hook DLL shipped in components/ (built with
# `cargo build -p rea-launcher-close-hook`); its parser checks our
# configuration in the host tests.
rea-launcher-close-hook = { git = "https://github.com/akitaonrails/rea-launcher-sdk", tag = "v0.8.2" }

# Its Windows parts are cfg(windows); who sees a message
# (report::Audience) is portable and tested on the host.
rea-launcher-win32 = { git = "https://github.com/akitaonrails/rea-launcher-sdk", tag = "v0.8.2" }

# Version information, icon and manifest in CMR4Launcher.exe (build.rs),
# so antivirus heuristics see a named, versioned program.
[build-dependencies]
rea-launcher-build = { git = "https://github.com/akitaonrails/rea-launcher-sdk", tag = "v0.8.2" }

[dev-dependencies]
rea-launcher-ui = { git = "https://github.com/akitaonrails/rea-launcher-sdk", tag = "v0.8.2", features = ["testing"] }

# The Wine test of the second-start window search (src/win32.rs) creates
# a window titled like the launcher's; the registry test deletes its keys.
[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Registry",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
panic = "abort"
opt-level = "s"
lto = true
strip = true
