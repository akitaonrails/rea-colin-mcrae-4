[package]
name = "cmr4-launcher"
version = "0.6.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
description = "Runs the user's own copy of Colin McRae Rally 04 on modern Windows and under Proton/Wine"

[workspace]

[[bin]]
name = "CMR4Launcher"
path = "src/main.rs"

[features]
# Only for building the shipped DLLs (packaging/build-windows.sh, with
# --lib so no executable links them): Cargo refuses `--features
# rea-launcher-dinput/dll` for a package outside the workspace.
layer-dlls = ["rea-launcher-close-hook/dll", "rea-launcher-dinput/dll"]

[dependencies]
rea-launcher = { git = "https://github.com/akitaonrails/rea-launcher-sdk", tag = "v0.9.0" }
# The settings window's drawing is portable (src/window.rs), so its GUI
# tests run headless on the host as well as under Wine.
rea-launcher-ui = { git = "https://github.com/akitaonrails/rea-launcher-sdk", tag = "v0.9.0" }
# The close hook DLL shipped in components/ (built with
# `cargo build -p rea-launcher-close-hook --features
# rea-launcher-close-hook/dll`); its parser checks our configuration in the
# host tests. Without `dll` the launcher gets only the library: the DLL's
# DllMain and exports would clash with the wheel layer's in our exe.
rea-launcher-close-hook = { git = "https://github.com/akitaonrails/rea-launcher-sdk", tag = "v0.9.0", default-features = false }
# The in-game wheel layer DLL shipped in components/ (built with
# `cargo build -p rea-launcher-dinput --features rea-launcher-dinput/dll`;
# here without `dll`, as above): it shows the game one virtual
# wheel made from the player's wheel and pedals.
rea-launcher-dinput = { git = "https://github.com/akitaonrails/rea-launcher-sdk", tag = "v0.9.0", default-features = false }

# Its Windows parts are cfg(windows); who sees a message
# (report::Audience) is portable and tested on the host.
rea-launcher-win32 = { git = "https://github.com/akitaonrails/rea-launcher-sdk", tag = "v0.9.0" }

# Version information, icon and manifest in CMR4Launcher.exe (build.rs),
# so antivirus heuristics see a named, versioned program.
[build-dependencies]
rea-launcher-build = { git = "https://github.com/akitaonrails/rea-launcher-sdk", tag = "v0.9.0" }

[dev-dependencies]
rea-launcher-ui = { git = "https://github.com/akitaonrails/rea-launcher-sdk", tag = "v0.9.0", features = ["testing"] }

# The Wine test of the second-start window search (src/win32.rs) creates
# a window titled like the launcher's; the registry test deletes its keys.
[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Registry",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
panic = "abort"
opt-level = "s"
lto = true
strip = true

# The DLLs that run inside the game (packaging/build-windows.sh): their
# catch_unwind guards turn a panic into an error code for one call, which
# needs unwinding; under the exe's abort a panic would end the game.
[profile.dll]
inherits = "release"
panic = "unwind"
