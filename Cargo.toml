[package]
name = "cmr4-launcher"
version = "0.2.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
description = "Runs the user's own copy of Colin McRae Rally 04 on modern Windows and under Proton/Wine"

[workspace]
members = ["close-hook"]
default-members = [".", "close-hook"]

[[bin]]
name = "CMR4Launcher"
path = "src/main.rs"

[dependencies]
sha2 = "0.11.1"

[target.'cfg(windows)'.dependencies]
eframe = { version = "0.37", default-features = false, features = ["glow"] }
jpeg-decoder = { version = "0.3", default-features = false }

[target.'cfg(windows)'.dependencies.windows-sys]
version = "0.61"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Media_Multimedia",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
]

[profile.release]
panic = "abort"
opt-level = "s"
lto = true
strip = true
