[package]
name = "cmr4-launcher"
version = "0.3.1"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
description = "Runs the user's own copy of Colin McRae Rally 04 on modern Windows and under Proton/Wine"

[workspace]

[[bin]]
name = "CMR4Launcher"
path = "src/main.rs"

[dependencies]
rea-launcher = { git = "https://github.com/akitaonrails/rea-launcher-sdk", tag = "v0.3.3" }
# The settings window's drawing is portable (src/window.rs), so its GUI
# tests run headless on the host as well as under Wine.
rea-launcher-ui = { git = "https://github.com/akitaonrails/rea-launcher-sdk", tag = "v0.3.3" }
# The close hook DLL shipped in components/ (built with
# `cargo build -p rea-launcher-close-hook`); its parser checks our
# configuration in the host tests.
rea-launcher-close-hook = { git = "https://github.com/akitaonrails/rea-launcher-sdk", tag = "v0.3.3" }

[target.'cfg(windows)'.dependencies]
rea-launcher-win32 = { git = "https://github.com/akitaonrails/rea-launcher-sdk", tag = "v0.3.3" }
# The second-start window search (src/win32.rs): the SDK finds a window
# by title or class only, and eframe windows share winit's class.
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
rea-launcher-ui = { git = "https://github.com/akitaonrails/rea-launcher-sdk", tag = "v0.3.3", features = ["testing"] }
# The pure registry helpers (VirtualStore path) are host-testable.
rea-launcher-win32 = { git = "https://github.com/akitaonrails/rea-launcher-sdk", tag = "v0.3.3" }

[profile.release]
panic = "abort"
opt-level = "s"
lto = true
strip = true
