name: Bug report
description: "CMR4Launcher.exe does not run Colin McRae Rally 04 as it should. Results that worked are welcome too."
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for the report. Never attach cmr4.exe, DLLs, saves, media or any other
        game files. Remove usernames and personal paths from settings and logs.
  - type: dropdown
    id: system
    attributes:
      label: Where did you play?
      options:
        - Windows 11
        - Windows 10
        - Steam Deck (Game Mode)
        - Steam Deck (Desktop Mode)
        - Linux with Steam / Proton
        - Linux with the AppImage
        - Linux with Wine and cmr4-play
        - Other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Launcher version
      description: The first line of launcher.log, e.g. "CMR4Launcher 0.3.0".
    validations:
      required: true
  - type: input
    id: sha256
    attributes:
      label: SHA-256 of cmr4.exe
      description: |
        launcher.log names the game's edition, or the SHA-256 of a build it does not know.
        Windows: `certutil -hashfile cmr4.exe SHA256`. Linux: `sha256sum cmr4.exe`.
    validations:
      required: true
  - type: input
    id: hardware
    attributes:
      label: CPU, graphics card, controller and screen
      description: e.g. "Ryzen 7 7800X3D, RTX 3060, Xbox-style pad, 2560x1440 at 144 Hz".
  - type: checkboxes
    id: worked
    attributes:
      label: What worked?
      options:
        - label: The settings window opened
        - label: The intro and menus displayed
        - label: A stage could be driven
        - label: Left stick / D-pad and RT/LT pedals
        - label: A/Start, B/Back, X and Y mappings
        - label: Saves and settings survived another launch
        - label: The game closed cleanly (Alt+F4 or closing its window)
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: What you did, what you expected and what happened instead.
    validations:
      required: true
  - type: textarea
    id: settings
    attributes:
      label: Settings used
      description: The look, resolution, frame-rate cap, VSync and Gamepad, or launcher.cfg without personal paths.
  - type: textarea
    id: log
    attributes:
      label: launcher.log
      description: |
        Windows: %LOCALAPPDATA%\CMR4Launcher\launcher.log. Under Wine or Proton it is inside
        the prefix (cmr4-play and the AppImage: ~/.local/share/cmr4-launcher/prefix).
        Remove personal paths before posting.
      render: text
    validations:
      required: true
