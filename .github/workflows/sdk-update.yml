name: sdk-update

# Weekly: opens or updates a pull request `sdk-update/vX.Y.Z` that moves this
# launcher to the newest rea-launcher-sdk tag, with the tag's Migration items
# in its body. It never merges (sdk/docs/playbooks/sdk-change.md, "Upgrading
# a launcher"). Needs "Allow GitHub Actions to create and approve pull
# requests" in the repository settings.
on:
  schedule: [{cron: "17 5 * * 1"}]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update:
    permissions: {contents: write, pull-requests: write}
    uses: akitaonrails/rea-launcher-sdk/.github/workflows/sdk-update.yml@v0.7.0
    # secrets: {token: ${{ secrets.SDK_UPDATE_TOKEN }}}  # so the PR runs CI
