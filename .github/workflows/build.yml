name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

jobs:
  ci:
    # fmt, host tests, cargo audit/deny, shell syntax and tests (linux/tests,
    # packaging/tests), the sdk/ drift check, Windows clippy and release
    # build, the Windows-target tests under Wine (headless), then the zip
    # and the AppImage checked against the allowlist.
    uses: akitaonrails/rea-launcher-sdk/.github/workflows/launcher-ci.yml@v0.7.0
    with:
      apt-packages: gcc-mingw-w64-i686 lld zip unzip cabextract
      shell-tests: linux/tests/*.sh packaging/tests/*.sh
      wine-tests: true
      package-command: |
        packaging/build-windows.sh "$REA_VERSION_NAME" dist "$REA_CACHE"
        "$REA_SDK/packaging/appimage-wine.sh" --app cmr4 --exe CMR4Launcher.exe \
          --icon packaging/appimage/cmr4-launcher.png \
          --desktop packaging/appimage/cmr4-launcher.desktop \
          --payload components --doc licenses --doc docs \
          --cache "$REA_CACHE" \
          --name "CMR4Launcher-$REA_VERSION_NAME" \
          "dist/CMR4Launcher-$REA_VERSION_NAME" dist
        test -s "dist/CMR4Launcher-$REA_VERSION_NAME-x86_64.AppImage"
      package-dir: dist/CMR4Launcher-*.zip
      package-allowlist: packaging/package.allow
      artifact-name: CMR4Launcher-packages
      artifact-paths: |
        dist/*.zip
        dist/*.AppImage

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: ci
    permissions:
      contents: write
      id-token: write
      attestations: write
    uses: akitaonrails/rea-launcher-sdk/.github/workflows/launcher-release.yml@v0.7.0
    with:
      package: cmr4-launcher
      artifact-pattern: CMR4Launcher-*
